<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-950 text-slate-100">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiche de Contrôle Armoire V2024 & Animation 3D Industrielle</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Three.js + OrbitControls CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Docx Library for Word generation -->
    <script src="https://unpkg.com/docx@7.8.2/build/index.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Space Grotesk', sans-serif;
            user-select: none;
            overflow-x: hidden;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.90);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .glass-btn {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-btn:hover {
            background: rgba(51, 65, 85, 0.9);
            border-color: rgba(56, 189, 248, 0.6);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.5);
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(51, 65, 85, 0.8);
            border-radius: 4px;
        }
    </style>
</head>
<body class="h-full text-slate-100 flex flex-col justify-between p-4 md:p-6">

    <!-- 3D Background Container -->
    <div id="canvas-container"></div>

    <!-- ================= MAIN APPLICATION CONTAINER (Direct Access) ================= -->
    <div id="main-app" class="relative z-10 flex flex-col gap-6 w-full max-w-6xl mx-auto pb-12 pointer-events-auto">
        
        <!-- Header Top -->
        <header class="flex flex-wrap justify-between items-center gap-4 glass-panel p-4 md:p-5 rounded-2xl shadow-2xl">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white shadow-lg shadow-cyan-500/30">
                    <i class="fa-solid fa-clipboard-check text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg md:text-xl tracking-tight text-white flex items-center gap-2">
                        FICHE DE CONTRÔLE ARMOIRE V2024
                        <span id="global-status-badge" class="text-xs px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700">En cours</span>
                    </h1>
                    <p class="text-xs text-slate-400">ELEC TECH - Contrôle Qualité & Réglementaire</p>
                </div>
            </div>
            <div class="flex items-center gap-2 flex-wrap">
                <button id="btn-toggle-3d" class="glass-btn px-3.5 py-2 rounded-xl text-xs font-medium flex items-center gap-2 text-slate-200">
                    <i class="fa-solid fa-cube text-cyan-400"></i><span>Basculer Vue 3D</span>
                </button>
            </div>
        </header>

        <!-- Section 1 : Informations Générales -->
        <section class="glass-panel rounded-2xl shadow-xl overflow-hidden">
            <div class="p-4 md:p-5 flex justify-between items-center bg-slate-900/60 border-b border-slate-800">
                <h2 class="text-sm font-bold text-cyan-400 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-circle-info"></i> 1. Informations Générales de l'Affaire
                </h2>
                <button onclick="toggleSection('section-meta')" id="btn-toggle-section-meta" class="text-xs text-slate-400 hover:text-white px-3 py-1 rounded-lg glass-btn flex items-center gap-1.5">
                    <i class="fa-solid fa-chevron-up" id="icon-meta"></i> Réduire
                </button>
            </div>
            <div id="section-meta" class="p-5 space-y-4 transition-all duration-300">
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 text-xs">
                    <div><label class="block text-slate-400 mb-1">Client :</label><input type="text" id="meta-client" placeholder="Nom du client" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-cyan-400" oninput="autoSave()" /></div>
                    <div><label class="block text-slate-400 mb-1">N° d'Affaire :</label><input type="text" id="meta-affaire" placeholder="Ex: 2024-892" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-cyan-400" oninput="autoSave()" /></div>
                    <div><label class="block text-slate-400 mb-1">Plan n° :</label><input type="text" id="meta-plan" placeholder="Référence plan" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-cyan-400" oninput="autoSave()" /></div>
                    <div><label class="block text-slate-400 mb-1">Indice :</label><input type="text" id="meta-indice" placeholder="Ex: B" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-cyan-400" oninput="autoSave()" /></div>
                    <div class="sm:col-span-2"><label class="block text-slate-400 mb-1">Identification de l'Armoire :</label><input type="text" id="meta-armoire" placeholder="Désignation de l'armoire / coffret" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-cyan-400" oninput="autoSave()" /></div>
                    <div><label class="block text-slate-400 mb-1">Nom du Câbleur :</label><input type="text" id="meta-cableur" placeholder="Nom du câbleur" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-cyan-400" oninput="autoSave()" /></div>
                    <div><label class="block text-slate-400 mb-1">Nom du Contrôleur :</label><input type="text" id="meta-controleur" placeholder="Nom du contrôleur" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-cyan-400" oninput="autoSave()" /></div>
                </div>
                <div class="pt-2 flex flex-wrap items-center gap-6 text-xs border-t border-slate-800">
                    <span class="text-slate-400 font-semibold">Type de Contrôle :</span>
                    <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="type-controle" value="REGLEMENTAIRE" checked onchange="autoSave()"> Réglementaire</label>
                    <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="type-controle" value="CABLEUR" onchange="autoSave()"> Contrôle Câbleur</label>
                    <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="type-controle" value="MODIFICATION" onchange="autoSave()"> Modification</label>
                    <label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="type-controle" value="FINAL" onchange="autoSave()"> Contrôle Final</label>
                </div>
            </div>
        </section>

        <!-- Section 2 : Grille de Contrôle & Photos -->
        <section class="glass-panel rounded-2xl shadow-xl overflow-hidden">
            <div class="p-4 md:p-5 flex justify-between items-center bg-slate-900/60 border-b border-slate-800">
                <h2 class="text-sm font-bold text-cyan-400 uppercase tracking-wider flex items-center gap-2">
                    <i class="fa-solid fa-list-check"></i> 2. Grille de Contrôle Détaillée & Photos
                </h2>
                <div class="flex items-center gap-4">
                    <div class="text-xs bg-slate-900 px-3 py-1.5 rounded-xl border border-slate-800">
                        Score Global : <span id="score-display" class="font-bold text-cyan-400">100%</span>
                    </div>
                    <button onclick="toggleSection('section-grid')" id="btn-toggle-section-grid" class="text-xs text-slate-400 hover:text-white px-3 py-1 rounded-lg glass-btn flex items-center gap-1.5">
                        <i class="fa-solid fa-chevron-up" id="icon-grid"></i> Réduire
                    </button>
                </div>
            </div>
            <div id="section-grid" class="p-5 space-y-6 transition-all duration-300">
                <div id="checklist-container" class="space-y-6"></div>
            </div>
        </section>

        <!-- Bas de page : Gestion Mémoire & Export Word -->
        <div class="flex flex-wrap justify-between items-center gap-4 pb-8">
            <div class="flex items-center gap-3">
                <button onclick="clearLocalStorage()" class="px-4 py-3 bg-slate-900 hover:bg-slate-800 border border-slate-700 text-slate-300 rounded-xl text-xs font-semibold flex items-center gap-2 transition">
                    <i class="fa-solid fa-trash-can text-red-400"></i> Effacer la mémoire
                </button>
                <span id="save-status" class="text-xs text-slate-500 italic">Sauvegardé en mémoire (Blob/Storage)</span>
            </div>
            <button id="btn-export-word" class="px-6 py-3.5 bg-gradient-to-r from-emerald-500 to-cyan-600 hover:from-emerald-400 hover:to-cyan-500 text-slate-950 font-bold rounded-2xl shadow-xl shadow-emerald-500/20 flex items-center gap-3 transition text-sm">
                <i class="fa-solid fa-file-word text-lg"></i> Générer le Rapport Word Professionnel (.docx)
            </button>
        </div>
    </div>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
        const grilleData = [
            {
                sectionId: "A",
                title: "ASPECT EXTÉRIEUR – ENVELOPPE",
                items: [
                    { id: "A1", label: "Vérification du bon état physique du Coffret ou de l'armoire (Rayures, chocs...)", reglementaire: false },
                    { id: "A2", label: "Vérification du bon état du matériel installé", reglementaire: false },
                    { id: "A3", label: "Vérification de la bonne fermeture du coffret ou de l'armoire", reglementaire: false },
                    { id: "A4", label: "Vérification de la fourniture de la clé ou de l'objet de déverrouillage", reglementaire: false },
                    { id: "A5", label: "Vérification de l'étanchéité 'relative' du coffret (Plastrons et capuchons)", reglementaire: false },
                    { id: "A6", label: "Vérification présence et bon état des Presses-étoupes", reglementaire: false },
                    { id: "A7", label: "Présence Signalisation Électrique sur face Avant du coffret", reglementaire: true },
                    { id: "A8", label: "Présence et Fonctionnement Mécanique du sectionneur", reglementaire: true },
                    { id: "A9", label: "Présence des repères Voyants et Boutonnerie 22,5", reglementaire: true },
                    { id: "A10", label: "Si présence arrêt d'urgence, collerette spécifique", reglementaire: true }
                ]
            },
            {
                sectionId: "B",
                title: "ÉQUIPEMENTS INTÉRIEURS DE L'ARMOIRE",
                items: [
                    { id: "B1", label: "Vérification du bon état du matériel installé", reglementaire: false },
                    { id: "B2", label: "Présence de tous les capots de goulottes et bon état", reglementaire: false },
                    { id: "B3", label: "Vérification de la bonne fixation des goulottes", reglementaire: false },
                    { id: "B4", label: "Vérification de la bonne fixation des rails et des équipements", reglementaire: false },
                    { id: "B5", label: "Pas de Fils Volants dans l'armoire !", reglementaire: true },
                    { id: "B6", label: "Si ATEX-SI : Respect normes montage Sécurité Intrinsèque", reglementaire: true },
                    { id: "B7", label: "Présence d'un porte-plans", reglementaire: false },
                    { id: "B8", label: "Présence des Schémas Électriques dans l'armoire", reglementaire: true },
                    { id: "B9", label: "Vérification mise à la terre des portes", reglementaire: true },
                    { id: "B10", label: "Présence/état barreau de terre et serrage connecteurs (Vis M5/M6)", reglementaire: true },
                    { id: "B11", label: "Identification de chaque fil câblé sur plans", reglementaire: false },
                    { id: "B12", label: "Serrage efficace des fils, des cosses", reglementaire: false },
                    { id: "B13", label: "Contrôle sertissage embouts de câblages", reglementaire: false },
                    { id: "B14", label: "Contrôle sertissage des cosses", reglementaire: false },
                    { id: "B15", label: "Un fil par borne", reglementaire: false },
                    { id: "B16", label: "Vérification de la couleur des fils", reglementaire: false },
                    { id: "B17", label: "Vérification de la nature des fils (CERN = Sans Halogène)", reglementaire: false },
                    { id: "B18", label: "Repérage des appareils (Conforme au plan et lisible)", reglementaire: true },
                    { id: "B19", label: "Repérage des fils et des câbles (Repère 503 Cembre)", reglementaire: false },
                    { id: "B20", label: "Repérage des borniers et N° de bornes", reglementaire: false },
                    { id: "B21", label: "Alim & Transfos : Raccordement référence terre + Carcasse Acier", reglementaire: true },
                    { id: "B22", label: "Matériel employé estampillé CE", reglementaire: false },
                    { id: "B23", label: "Vérification nomenclature / cahier des charges", reglementaire: false },
                    { id: "B24", label: "Présence des fusibles conformément au schéma", reglementaire: false },
                    { id: "B25", label: "Autres contrôles spécifiques clients", reglementaire: false }
                ]
            },
            {
                sectionId: "C",
                title: "ESSAIS FONCTIONNELS",
                items: [
                    { id: "C1", label: "Vérification des polarités et tensions par contrôleur universel", reglementaire: false },
                    { id: "C2", label: "Validation fonctionnement Voyant Sous Tension et/ou TRI-Led", reglementaire: true },
                    { id: "C3", label: "Validation déclenchement Inter-Différentiels", reglementaire: true },
                    { id: "C4", label: "Validation du fonctionnement des alimentations", reglementaire: false },
                    { id: "C5", label: "Vérification des tensions sur répartiteurs", reglementaire: false },
                    { id: "C6", label: "Validation fonctionnement ventilation et thermostat", reglementaire: false },
                    { id: "C7", label: "Validation de l'isolement diélectrique", reglementaire: false }
                ]
            }
        ];

        let userResponses = {};

        function autoSave() {
            const dataToSave = {
                meta: {
                    client: document.getElementById('meta-client').value,
                    affaire: document.getElementById('meta-affaire').value,
                    plan: document.getElementById('meta-plan').value,
                    indice: document.getElementById('meta-indice').value,
                    armoire: document.getElementById('meta-armoire').value,
                    cableur: document.getElementById('meta-cableur').value,
                    controleur: document.getElementById('meta-controleur').value,
                    type: document.querySelector('input[name="type-controle"]:checked')?.value
                },
                responses: userResponses
            };
            try {
                localStorage.setItem('checklist_armoire_data', JSON.stringify(dataToSave));
                document.getElementById('save-status').innerText = "Sauvegardé en mémoire (" + new Date().toLocaleTimeString() + ")";
            } catch(e) {
                document.getElementById('save-status').innerText = "Attention: Stockage saturé (photos trop lourdes)";
            }
        }

        function loadSavedData() {
            const saved = localStorage.getItem('checklist_armoire_data');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    if (parsed.meta) {
                        document.getElementById('meta-client').value = parsed.meta.client || '';
                        document.getElementById('meta-affaire').value = parsed.meta.affaire || '';
                        document.getElementById('meta-plan').value = parsed.meta.plan || '';
                        document.getElementById('meta-indice').value = parsed.meta.indice || '';
                        document.getElementById('meta-armoire').value = parsed.meta.armoire || '';
                        document.getElementById('meta-cableur').value = parsed.meta.cableur || '';
                        document.getElementById('meta-controleur').value = parsed.meta.controleur || '';
                        if (parsed.meta.type) {
                            const radio = document.querySelector(`input[name="type-controle"][value="${parsed.meta.type}"]`);
                            if (radio) radio.checked = true;
                        }
                    }
                    if (parsed.responses) {
                        userResponses = parsed.responses;
                    }
                } catch(e) { console.error(e); }
            }
        }

        function clearLocalStorage() {
            if (confirm("Voulez-vous vraiment effacer les données enregistrées en mémoire ?")) {
                localStorage.removeItem('checklist_armoire_data');
                location.reload();
            }
        }

        window.toggleSection = function(sectionId) {
            const el = document.getElementById(sectionId);
            const isHidden = el.classList.contains('hidden');
            const iconId = sectionId === 'section-meta' ? 'icon-meta' : 'icon-grid';
            const btnText = sectionId === 'section-meta' ? 'btn-toggle-section-meta' : 'btn-toggle-section-grid';

            if (isHidden) {
                el.classList.remove('hidden');
                document.getElementById(iconId).className = "fa-solid fa-chevron-up";
                document.getElementById(btnText).innerHTML = `<i class="fa-solid fa-chevron-up" id="${iconId}"></i> Réduire`;
            } else {
                el.classList.add('hidden');
                document.getElementById(iconId).className = "fa-solid fa-chevron-down";
                document.getElementById(btnText).innerHTML = `<i class="fa-solid fa-chevron-down" id="${iconId}"></i> Déployer`;
            }
        }

        let show3D = true;
        document.getElementById('btn-toggle-3d').addEventListener('click', () => {
            show3D = !show3D;
            document.getElementById('canvas-container').style.display = show3D ? 'block' : 'none';
        });

        function initChecklistUI() {
            const container = document.getElementById('checklist-container');
            container.innerHTML = '';

            grilleData.forEach(section => {
                const sectionDiv = document.createElement('div');
                sectionDiv.className = "bg-slate-900/60 border border-slate-800 rounded-xl p-4 space-y-3";
                
                let html = `
                    <h3 class="font-bold text-slate-200 text-sm flex items-center justify-between">
                        <span>${section.sectionId}. ${section.title}</span>
                        <span class="text-xs font-normal text-slate-400">${section.items.length} points</span>
                    </h3>
                    <div class="space-y-3 pt-2">
                `;

                section.items.forEach(item => {
                    if (!userResponses[item.id]) {
                        userResponses[item.id] = { status: "OK", comment: "", photos: [] };
                    }
                    if (!userResponses[item.id].photos) userResponses[item.id].photos = [];
                    const resp = userResponses[item.id];

                    let photosHtml = '';
                    resp.photos.forEach((photoData, pIndex) => {
                        photosHtml += `
                            <div class="relative group w-16 h-16 rounded-lg overflow-hidden border border-slate-700 bg-slate-900">
                                <img src="${photoData}" class="w-full h-full object-cover">
                                <button type="button" onclick="removePhoto('${item.id}', ${pIndex})" class="absolute top-1 right-1 bg-red-600/80 hover:bg-red-600 text-white w-5 h-5 rounded-full text-[10px] flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                        `;
                    });

                    html += `
                        <div class="bg-slate-950/80 border border-slate-800/80 p-3.5 rounded-xl space-y-3">
                            <div class="flex flex-col md:flex-row md:items-center justify-between gap-3">
                                <div class="flex items-start gap-2 flex-1">
                                    ${item.reglementaire ? '<span class="px-1.5 py-0.5 rounded bg-red-950 text-red-400 border border-red-900 text-[10px] font-bold shrink-0 mt-0.5">RÉGLEMENTAIRE</span>' : ''}
                                    <span class="text-xs text-slate-300">${item.label}</span>
                                </div>
                                <div class="flex items-center gap-3 shrink-0">
                                    <div class="flex items-center bg-slate-900 rounded-lg p-1 border border-slate-800">
                                        <button type="button" onclick="setStatus('${item.id}', 'OK')" id="btn-${item.id}-OK" class="px-3 py-1 rounded text-xs font-bold transition ${resp.status === 'OK' ? 'bg-emerald-600 text-white shadow' : 'text-slate-400'}">OK</button>
                                        <button type="button" onclick="setStatus('${item.id}', 'NOK')" id="btn-${item.id}-NOK" class="px-3 py-1 rounded text-xs font-bold transition ${resp.status === 'NOK' ? 'bg-red-600 text-white shadow' : 'text-slate-400'}">NOK</button>
                                        <button type="button" onclick="setStatus('${item.id}', 'SO')" id="btn-${item.id}-SO" class="px-3 py-1 rounded text-xs font-bold transition ${resp.status === 'SO' ? 'bg-slate-700 text-white shadow' : 'text-slate-400'}">S.O.</button>
                                    </div>
                                    <input type="text" placeholder="Commentaire / Réserve..." value="${resp.comment || ''}" oninput="setComment('${item.id}', this.value)" class="bg-slate-900 border border-slate-800 rounded-lg px-2.5 py-1 text-xs text-slate-200 w-48 focus:outline-none focus:border-cyan-400" />
                                </div>
                            </div>

                            <!-- Bloc photos natif : Parcourir / Appareil photo -->
                            <div class="pt-2 border-t border-slate-900 flex flex-wrap items-center gap-3">
                                <div class="flex items-center gap-2 overflow-x-auto py-1" id="photos-list-${item.id}">
                                    ${photosHtml}
                                </div>
                                <div class="flex items-center gap-2 ml-auto">
                                    <label class="glass-btn px-2.5 py-1.5 rounded-lg text-[11px] font-medium text-slate-300 cursor-pointer flex items-center gap-1.5 hover:text-cyan-400">
                                        <i class="fa-solid fa-folder-open"></i> Parcourir
                                        <input type="file" accept="image/*" class="hidden" onchange="handleFileSelect(event, '${item.id}')">
                                    </label>
                                    <label class="glass-btn px-2.5 py-1.5 rounded-lg text-[11px] font-medium text-slate-300 cursor-pointer flex items-center gap-1.5 hover:text-cyan-400">
                                        <i class="fa-solid fa-camera"></i> Appareil photo
                                        <input type="file" accept="image/*" capture="environment" class="hidden" onchange="handleFileSelect(event, '${item.id}')">
                                    </label>
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += `</div>`;
                sectionDiv.innerHTML = html;
                container.appendChild(sectionDiv);
            });
            updateScore();
        }

        window.setStatus = function(itemId, status) {
            userResponses[itemId].status = status;
            ['OK', 'NOK', 'SO'].forEach(s => {
                const btn = document.getElementById(`btn-${itemId}-${s}`);
                if (s === status) {
                    btn.className = "px-3 py-1 rounded text-xs font-bold transition shadow " + (s === 'OK' ? 'bg-emerald-600 text-white' : s === 'NOK' ? 'bg-red-600 text-white' : 'bg-slate-700 text-white');
                } else {
                    btn.className = "px-3 py-1 rounded text-xs font-bold transition text-slate-400";
                }
            });
            updateScore();
            autoSave();
        }

        window.setComment = function(itemId, val) {
            userResponses[itemId].comment = val;
            autoSave();
        }

        window.handleFileSelect = function(event, itemId) {
            const files = event.target.files;
            if (!files || files.length === 0) return;
            const file = files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const base64Img = e.target.result;
                if (!userResponses[itemId].photos) userResponses[itemId].photos = [];
                userResponses[itemId].photos.push(base64Img);
                initChecklistUI();
                autoSave();
            };
            reader.readAsDataURL(file);
        }

        window.removePhoto = function(itemId, index) {
            if (userResponses[itemId] && userResponses[itemId].photos) {
                userResponses[itemId].photos.splice(index, 1);
                initChecklistUI();
                autoSave();
            }
        }

        function updateScore() {
            let total = 0, earned = 0, hasRegNok = false;
            grilleData.forEach(sec => {
                sec.items.forEach(item => {
                    const resp = userResponses[item.id];
                    if (!resp || resp.status === 'SO') return;
                    const weight = item.reglementaire ? 3 : 1;
                    total += weight;
                    if (resp.status === 'OK') earned += weight;
                    else if (resp.status === 'NOK' && item.reglementaire) hasRegNok = true;
                });
            });

            const percentage = total > 0 ? Math.round((earned / total) * 100) : 100;
            const isConforme = !hasRegNok && percentage >= 95;

            document.getElementById('score-display').innerText = percentage + '%';
            const badge = document.getElementById('global-status-badge');
            if (isConforme) {
                badge.className = "text-xs px-2.5 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 font-bold";
                badge.innerText = "CONFORME";
            } else {
                badge.className = "text-xs px-2.5 py-0.5 rounded-full bg-red-500/20 text-red-400 border border-red-500/30 font-bold";
                badge.innerText = "NON CONFORME";
            }
        }

        // ================= RAPPORT WORD PRO (DOCX) =================
        document.getElementById('btn-export-word').addEventListener('click', async () => {
            const client = document.getElementById('meta-client').value || "N/C";
            const affaire = document.getElementById('meta-affaire').value || "N/C";
            const plan = document.getElementById('meta-plan').value || "N/C";
            const indice = document.getElementById('meta-indice').value || "N/C";
            const armoire = document.getElementById('meta-armoire').value || "N/C";
            const cableur = document.getElementById('meta-cableur').value || "N/C";
            const controleur = document.getElementById('meta-controleur').value || "N/C";
            const typeControle = document.querySelector('input[name="type-controle"]:checked').value;

            let total = 0, earned = 0, hasRegNok = false;
            grilleData.forEach(sec => {
                sec.items.forEach(item => {
                    const resp = userResponses[item.id];
                    if (!resp || resp.status === 'SO') return;
                    const weight = item.reglementaire ? 3 : 1;
                    total += weight;
                    if (resp.status === 'OK') earned += weight;
                    else if (resp.status === 'NOK' && item.reglementaire) hasRegNok = true;
                });
            });
            const pct = total > 0 ? Math.round((earned / total) * 100) : 100;
            const isConf = !hasRegNok && pct >= 95;

            const { Document, Packer, Paragraph, TextRun, ImageRun } = window.docx;

            function base64ToUint8Array(base64) {
                const parts = base64.split(';base64,');
                const raw = window.atob(parts[1]);
                const rawLength = raw.length;
                const uInt8Array = new Uint8Array(rawLength);
                for (let i = 0; i < rawLength; ++i) {
                    uInt8Array[i] = raw.charCodeAt(i);
                }
                return uInt8Array;
            }

            const docChildren = [
                new Paragraph({ children: [new TextRun({ text: "RAPPORT DE CONTRÔLE ARMOIRE - V2024", bold: true, size: 32, color: "0284C7" })], spacing: { after: 200 } }),
                new Paragraph({ children: [new TextRun({ text: `Client : `, bold: true }), new TextRun({ text: `${client}   |   ` }), new TextRun({ text: `Affaire : `, bold: true }), new TextRun({ text: `${affaire}` })], spacing: { after: 100 } }),
                new Paragraph({ children: [new TextRun({ text: `Armoire : `, bold: true }), new TextRun({ text: `${armoire}   |   ` }), new TextRun({ text: `Plan : `, bold: true }), new TextRun({ text: `${plan} (Indice ${indice})` })], spacing: { after: 100 } }),
                new Paragraph({ children: [new TextRun({ text: `Câbleur : `, bold: true }), new TextRun({ text: `${cableur}   |   ` }), new TextRun({ text: `Contrôleur : `, bold: true }), new TextRun({ text: `${controleur}` })], spacing: { after: 100 } }),
                new Paragraph({ children: [new TextRun({ text: `Type de Contrôle : `, bold: true }), new TextRun({ text: `${typeControle}` })], spacing: { after: 200 } }),
                new Paragraph({ children: [new TextRun({ text: `RÉSULTAT GLOBAL : `, bold: true }), new TextRun({ text: `${isConf ? "CONFORME" : "NON CONFORME"} (${pct}%)`, bold: true, color: isConf ? "008000" : "FF0000" })], spacing: { after: 300 } })
            ];

            grilleData.forEach(sec => {
                docChildren.push(new Paragraph({ children: [new TextRun({ text: `SECTION ${sec.sectionId} : ${sec.title}`, bold: true, size: 24, color: "1E293B" })], spacing: { before: 200, after: 150 } }));

                sec.items.forEach(item => {
                    const resp = userResponses[item.id] || { status: "OK", comment: "", photos: [] };
                    const statusColor = resp.status === 'OK' ? "008000" : resp.status === 'NOK' ? "FF0000" : "64748B";

                    const itemParagraphs = [
                        new Paragraph({
                            children: [
                                new TextRun({ text: `[${resp.status}] `, bold: true, color: statusColor }),
                                new TextRun({ text: `${item.label} ` }),
                                item.reglementaire ? new TextRun({ text: "[RÉGLEMENTAIRE] ", bold: true, color: "FF0000", size: 16 }) : new TextRun({ text: "" }),
                                resp.comment ? new TextRun({ text: `\nCommentaire : ${resp.comment}`, italics: true, color: "475569" }) : new TextRun({ text: "" })
                            ],
                            spacing: { after: 100 }
                        })
                    ];

                    if (resp.photos && resp.photos.length > 0) {
                        resp.photos.forEach(photoBase64 => {
                            try {
                                const imgData = base64ToUint8Array(photoBase64);
                                itemParagraphs.push(
                                    new Paragraph({
                                        children: [
                                            new ImageRun({
                                                data: imgData,
                                                transformation: { width: 180, height: 135 }
                                            })
                                        ],
                                        spacing: { after: 100 }
                                    })
                                );
                            } catch(err) { console.error("Erreur image docx", err); }
                        });
                    }

                    docChildren.push(...itemParagraphs);
                });
            });

            const doc = new Document({ sections: [{ children: docChildren }] });
            const blob = await Packer.toBlob(doc);
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Rapport_Controle_${affaire.replace(/[^a-z0-9]/gi, '_')}.docx`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        });

        // ================= ANIMATION 3D THREE.JS =================
        let scene, camera, renderer, controls;
        function init3D() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x090d16, 0.018);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 28);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;

            scene.add(new THREE.AmbientLight(0x38bdf8, 0.6));
            const mainLight = new THREE.DirectionalLight(0xffffff, 2.0);
            mainLight.position.set(15, 22, 18);
            scene.add(mainLight);

            const cabinetGroup = new THREE.Group();
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.3, metalness: 0.8 });
            const plateMat = new THREE.MeshStandardMaterial({ color: 0x475569, roughness: 0.2, metalness: 0.85 });

            const backEnclosure = new THREE.Mesh(new THREE.BoxGeometry(12, 18, 0.1), frameMat);
            backEnclosure.position.set(0, 0, -2);
            cabinetGroup.add(backEnclosure);

            const plate = new THREE.Mesh(new THREE.BoxGeometry(11.2, 16.8, 0.2), plateMat);
            plate.position.set(0, 0, -1.6);
            cabinetGroup.add(plate);

            const vfdGroup = new THREE.Group();
            const vfdBody = new THREE.Mesh(new THREE.BoxGeometry(3.2, 5.0, 2.2), new THREE.MeshStandardMaterial({ color: 0x0284c7, roughness: 0.3 }));
            vfdGroup.add(vfdBody);
            vfdGroup.position.set(-2.5, 4.2, -0.5);
            cabinetGroup.add(vfdGroup);

            scene.add(cabinetGroup);

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function animate3D() {
            requestAnimationFrame(animate3D);
            if (controls) controls.update();
            if (renderer && scene && camera) renderer.render(scene, camera);
        }

        window.onload = function() {
            loadSavedData();
            initChecklistUI();
            init3D();
            animate3D();
        };
    </script>
</body>
</html>
